name: Release PC

# Publica la versión de escritorio (Windows + Linux) en GitHub Releases.
# Se dispara al subir un tag v*, ej: git tag v1.0.0 && git push origin v1.0.0
# La versión del instalador sale de electron/package.json -> súbela antes del tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    env:
      VITE_SERVER_URL: https://sysgd-production.up.railway.app
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias (web)
        run: npm ci

      - name: Build web + copiar a electron/www
        run: npm run build-electron

      - name: Instalar dependencias (electron)
        working-directory: electron
        run: npm ci

      - name: Compilar instalador Windows
        working-directory: electron
        run: npx electron-builder --win

      - name: Subir artefacto Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            electron/dist/*.exe
            electron/dist/*.blockmap
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: https://sysgd-production.up.railway.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias (web)
        run: npm ci

      - name: Build web + copiar a electron/www
        run: npm run build-electron

      - name: Instalar dependencias (electron)
        working-directory: electron
        run: npm ci

      - name: Compilar AppImage Linux
        working-directory: electron
        run: npx electron-builder --linux

      - name: Subir artefacto Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: electron/dist/*.AppImage
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: https://sysgd-production.up.railway.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias (web)
        run: npm ci

      - name: Build web + sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir artefacto Android
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-android-release:
    # NOTA: no se puede usar `secrets` en el `if` de un job (workflow inválido).
    # Este repo tiene los secrets configurados, así que corre siempre.
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: https://sysgd-production.up.railway.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias (web)
        run: npm ci

      - name: Build web + sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Restaurar keystore desde el secret
        working-directory: android/app
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Compilar APK firmado
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Subir artefacto Android firmado
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-ios:
    # Genera un IPA SIN FIRMAR para sideloading (Sideloadly/AltStore/3uTools
    # desde PC: ellos lo re-firman con el Apple ID del usuario).
    # No bloquea el Release principal si falla.
    runs-on: macos-latest
    env:
      VITE_SERVER_URL: https://sysgd-production.up.railway.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias (web)
        run: npm ci

      - name: Build web + sync Capacitor
        run: |
          npm run build
          npx cap sync ios

      - name: Instalar Pods
        working-directory: ios/App
        run: pod install

      - name: Compilar .app sin firmar
        run: >
          xcodebuild -workspace ios/App/App.xcworkspace
          -scheme App -configuration Release
          -sdk iphoneos -derivedDataPath /tmp/dd build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Empaquetar IPA sin firmar
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          APP_PATH=$(find /tmp/dd -name "App.app" -path "*Release-iphoneos*" | head -1)
          test -n "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r "GCTCP-${TAG}-unsigned.ipa" Payload

      - name: Subir artefacto iOS
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: GCTCP-*.ipa
          if-no-files-found: error

  publish-ios:
    needs: [build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: artifacts-ios

      - name: Adjuntar IPA al Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts-ios/*.ipa
          generate_release_notes: false

  publish:
    needs: [build-win, build-linux, build-android, build-android-release]
    # El job de release puede omitirse (sin secrets): no debe bloquear.
    if: ${{ always() && (needs.build-win.result == 'success' && needs.build-linux.result == 'success' && needs.build-android.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
